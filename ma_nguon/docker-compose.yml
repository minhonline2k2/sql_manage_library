# Chạy từ thư mục ma_nguon:  docker compose up -d --build   → giao diện http://localhost:8501
# Lần đầu container db tự dựng CSDL QLTV (01..07). Dựng lại từ đầu: docker compose down -v && docker compose up -d
# Đổi cổng nếu máy đã dùng: APP_PORT=8502 DB_PORT=3308 docker compose up -d
name: qltv
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}   # mật khẩu demo, chỉ dùng trên máy cá nhân
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3307}:3306"   # kết nối từ máy: 127.0.0.1:3307 (root/root hoặc ql_thuvien/QuanLy@2026)
    volumes:
      - ./sql:/sql:ro
      - ./docker/khoi_tao_csdl.sh:/docker-entrypoint-initdb.d/khoi_tao_csdl.sh:ro
      - qltv-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      QLTV_HOST: db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ./app:/app   # sửa code trong app/ là giao diện cập nhật ngay
    depends_on:
      db:
        condition: service_healthy

volumes:
  qltv-data:
